[project]
name = "jamaat-bot"
version = "0.1.0"
description = "Telegram bot for organizing jamaat prayer in group chats"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "APScheduler>=3.10,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "qrcode[pil]>=7.4,<8.0",
    "Pillow>=10.4,<11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "time-machine>=2.15,<3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "time-machine>=2.15,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
